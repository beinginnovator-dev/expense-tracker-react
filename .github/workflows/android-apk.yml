name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [android-release]
    paths:
      - 'index.html'
      - 'www/**'
      - 'ads*.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npm run android:init
      - name: Verify Google Play target API requirement
        run: |
          echo "Checking Capacitor Android target SDK..."
          grep -R -E 'targetSdkVersion[[:space:]]*=?[[:space:]]*36' android/variables.gradle android/app/build.gradle
      - name: Sync web app
        run: npm run android:sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Build release AAB (unsigned validation build)
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
